<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chatting IABOT · Tu centro de conversaciones</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f5f9;color:#22253b;font:14px system-ui,sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer;border:0;border-radius:9px;padding:11px 16px;background:#ececf4;color:#44465f}button:hover{filter:brightness(.96)}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #aaa2ff}.primary{background:#7061e8;color:white}.shell{display:grid;grid-template-columns:220px 1fr;min-height:100vh}nav{background:#171a2b;color:#a8abc2;padding:30px 18px;display:flex;flex-direction:column;gap:10px}.brand{color:white;font-weight:750;font-size:20px;margin:0 8px 38px}.brand span{color:#a59aff}nav button{text-align:left;background:transparent;color:inherit}nav button.active{background:#302c50;color:#c9c1ff}nav small{margin-top:auto;padding:20px 10px;line-height:1.8}main{padding:30px 36px;min-width:0}header{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}h1{font-size:27px;letter-spacing:-1px;margin:0 0 7px}p{color:#85879c;margin:0;line-height:1.6}.badge{display:inline-block;padding:6px 10px;background:#e8e4fc;color:#7362cf;border-radius:7px;font-size:12px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-bottom:24px}.stat,.panel{background:white;border:1px solid #e7e8f0;border-radius:14px}.stat{padding:20px}.stat strong{display:block;font-size:26px;margin-top:8px}.workspace{display:grid;grid-template-columns:300px 1fr;min-height:550px;overflow:hidden}.list{border-right:1px solid #eee;padding:18px}.search,input,textarea,select{width:100%;border:1px solid #dedfe9;border-radius:8px;padding:11px;background:#fafafe;color:#30334c}.filters{display:flex;gap:5px;margin:14px 0}.filters button{padding:7px 10px;font-size:12px}.filters button.active{background:#eeeaff;color:#6b58d5}.person{width:100%;background:white;display:flex;gap:12px;text-align:left;padding:15px 9px;margin:5px 0}.person.selected{background:#f0edff}.avatar{width:38px;height:38px;border-radius:12px;background:#e4defb;display:grid;place-items:center;color:#7661bb;font-weight:700;flex-shrink:0}.person strong{display:block}.person small{display:block;color:#9091a3;margin-top:5px}.dot{color:#30a687;margin-left:auto}.chat{display:flex;flex-direction:column;min-width:0}.chathead{padding:19px 24px;border-bottom:1px solid #eee;display:flex;justify-content:space-between;gap:12px;align-items:center}.messages{flex:1;padding:26px;min-height:290px;max-height:430px;overflow:auto;display:flex;flex-direction:column;gap:18px;background:linear-gradient(#fff,#fcfcff)}.bubble{max-width:78%;padding:13px 17px;border-radius:13px;background:#f0f1f6;align-self:flex-start;white-space:pre-wrap;line-height:1.6}.bubble.mine{background:#7564e9;color:white;align-self:flex-end}.composer{padding:18px 24px;border-top:1px solid #eee;display:flex;gap:10px}.composer input{flex:1;min-width:0}.note{font-size:12px;padding:0 24px 15px;color:#9293a5}.settings{max-width:930px;padding:28px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:22px}label{display:block;font-weight:600;margin-bottom:18px}label input,label select,label textarea{margin-top:9px;font-weight:400}textarea{min-height:110px;resize:vertical}h2{font-size:18px;margin:0 0 22px}.wide{grid-column:1/-1}.row{display:flex;justify-content:space-between;gap:20px;align-items:center}.hint{font-size:12px;color:#888ca0;font-weight:400;margin-top:6px}.switch{accent-color:#7564e9;width:19px;height:19px}.toast{position:fixed;bottom:25px;right:25px;background:#24253e;color:white;padding:14px 23px;border-radius:10px;display:none}.empty{padding:40px;text-align:center;color:#888}footer{margin-top:18px;font-size:12px;color:#8e90a4} @media(max-width:1000px){.shell{grid-template-columns:170px 1fr}main{padding:24px 18px}.workspace{grid-template-columns:240px 1fr}.chathead{flex-wrap:wrap}}@media(max-width:720px){.shell{display:block}nav{padding:14px;flex-direction:row;flex-wrap:wrap;align-items:center}.brand{margin:0 10px 0 0;font-size:17px}nav small{display:none}main{padding:20px 12px}.stats{gap:8px}.stat{padding:12px}.stat strong{font-size:23px}.workspace{grid-template-columns:1fr}.list{border-right:0;border-bottom:1px solid #eee}.people{max-height:170px;overflow:auto}.grid{grid-template-columns:1fr}.wide{grid-column:auto}header{gap:10px}h1{font-size:23px}.chathead{padding:16px}.composer{padding:15px}.bubble{max-width:92%}}
</style><div class="shell"><nav><div class="brand">◈ Chatting<span> IA</span></div><button id="inboxNav" class="active">▤ &nbsp; Conversaciones</button><button id="settingsNav">⚙ &nbsp; Mi asistente</button><small>ESPACIO DE TRABAJO<br>Proyecto IABOT<br><span class="badge">Versión de prueba · 0.1</span></small></nav><main><header><div><h1 id="title">Conversaciones</h1><p id="subtitle">Tu equipo y tu asistente, en un mismo lugar.</p></div><span class="badge">Datos de ejemplo</span></header><div id="content"></div><footer>Entorno de prueba · Sin conexión a cuentas ni envíos reales · Configuración guardada en este navegador</footer></main></div><div class="toast" role="status" id="toast"></div><script>
const key='iabot-v1';const defaults={mode:'selected',tone:'Cercano y natural',instructions:'Responde de forma breve y clara. Mantén el contexto y pide intervención cuando no tengas la información necesaria.',words:'hola, qué tal, cuéntame',avoid:'mensajes repetitivos, respuestas demasiado largas',min:15,max:45,video:true};let saved;try{saved=JSON.parse(localStorage.getItem(key)||'null')}catch{}let config={...defaults,...saved?.config};let fans=saved?.fans||[{id:1,name:'Alex',tag:'Conversación nueva',on:true,messages:[{text:'¡Hola! ¿Qué tal va tu día?',mine:false},{text:'¡Hola Alex! Muy bien, ¿y el tuyo?',mine:true}]},{id:2,name:'Daniel',tag:'Pendiente de respuesta',on:false,messages:[{text:'Hola, ¿tienes un momento?',mine:false}]},{id:3,name:'Marcos',tag:'Conversación en curso',on:true,messages:[{text:'Hoy por fin he terminado el proyecto que te conté.',mine:false}]},{id:4,name:'Lucas',tag:'Seguimiento',on:false,messages:[{text:'¡Gracias por acordarte!',mine:false}]}];let current=1,filter='all',query='',view='inbox';const $=s=>document.querySelector(s);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const active=f=>config.mode==='all'||config.mode==='selected'&&f.on;function persist(){try{localStorage.setItem(key,JSON.stringify({config,fans}));return true}catch{toast('No se pudo guardar: almacenamiento no disponible');return false}}function toast(t){$('#toast').textContent=t;$('#toast').style.display='block';clearTimeout(window.notice);window.notice=setTimeout(()=>$('#toast').style.display='none',3200)}
function render(){ $('#inboxNav').classList.toggle('active',view==='inbox');$('#settingsNav').classList.toggle('active',view==='settings');$('#title').textContent=view==='inbox'?'Conversaciones':'Mi asistente';$('#subtitle').textContent=view==='inbox'?'Tu equipo y tu asistente, en un mismo lugar.':'Define cómo escribe, a quién atiende y cuándo responde.';view==='inbox'?inbox():settings()}
function inbox(){const fan=fans.find(f=>f.id===current);$('#content').innerHTML=`<div class="stats"><div class="stat"><p>Conversaciones</p><strong>${fans.length}</strong></div><div class="stat"><p>Asistente habilitado</p><strong>${fans.filter(active).length}<span style="font-size:13px;color:#9293a5"> / ${fans.length}</span></strong></div><div class="stat"><p>Modo actual</p><strong style="font-size:21px">${{all:'Todos los fans',selected:'Selección manual',off:'Pausado'}[config.mode]}</strong></div></div><section class="panel workspace"><aside class="list"><input id="search" aria-label="Buscar fan" placeholder="Buscar conversación…" value="${esc(query)}"><div class="filters"><button data-filter="all" class="${filter==='all'?'active':''}">Todos</button><button data-filter="active" class="${filter==='active'?'active':''}">Con asistente</button></div><div class="people" id="people"></div></aside><section class="chat"><div class="chathead"><div><strong>${esc(fan.name)}</strong><p style="font-size:12px">Conversación de ejemplo</p></div><label style="margin:0;font-size:12px;display:flex;gap:8px;align-items:center"><input id="fanToggle" class="switch" type="checkbox" ${fan.on?'checked':''} ${config.mode!=='selected'?'disabled':''}>Asistente ${active(fan)?'habilitado':'desactivado'}</label></div>${config.mode!=='selected'?'<div class="note" style="padding-top:12px">Para elegir fans individualmente, selecciona «Fans seleccionados» en Mi asistente.</div>':''}<div class="messages" id="messages"></div><form class="composer" id="composer"><input id="draft" aria-label="Mensaje de prueba" placeholder="Escribe un mensaje de prueba…" maxlength="3000" required><button class="primary">Añadir</button></form><div class="note">Los mensajes se añaden solo a esta demostración. El asistente aún no genera respuestas.</div></section></section>`;people();$('#messages').innerHTML=fan.messages.map(m=>`<div class="bubble ${m.mine?'mine':''}">${esc(m.text)}</div>`).join('');$('#messages').scrollTop=$('#messages').scrollHeight;$('#search').oninput=e=>{query=e.target.value;people()};document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;inbox()});$('#fanToggle').onchange=e=>{fan.on=e.target.checked;persist();inbox()};$('#composer').onsubmit=e=>{e.preventDefault();const text=$('#draft').value.trim();if(!text)return;fan.messages.push({text,mine:true});persist();inbox();$('#draft').focus()}}
function people(){const matches=fans.filter(f=>f.name.toLowerCase().includes(query.toLowerCase())&&(filter!=='active'||active(f)));$('#people').innerHTML=matches.map(f=>`<button class="person ${f.id===current?'selected':''}" data-id="${f.id}"><span class="avatar">${esc(f.name[0])}</span><span><strong>${esc(f.name)}</strong><small>${esc(f.tag)}</small></span>${active(f)?'<span class="dot" title="Asistente habilitado">●</span>':''}</button>`).join('')||'<div class="empty">No hay coincidencias.</div>';document.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>{current=Number(b.dataset.id);inbox()})}
function settings(){$('#content').innerHTML=`<form class="panel settings" id="settings"><h2>El asistente, a tu manera</h2><div class="grid"><label>Activación<select name="mode"><option value="selected">Fans seleccionados</option><option value="all">Todos los fans</option><option value="off">Pausar asistente</option></select><div class="hint">En selección manual, activa cada fan desde su conversación.</div></label><label>Tono<select name="tone"><option>Cercano y natural</option><option>Directo y breve</option><option>Cálido y expresivo</option><option>Personalizado</option></select></label><label class="wide">Instrucciones de comportamiento<textarea name="instructions" maxlength="12000"></textarea></label><label>Palabras y expresiones preferidas<textarea name="words" maxlength="3000"></textarea></label><label>Palabras y hábitos que evitar<textarea name="avoid" maxlength="3000"></textarea></label><label>Espera mínima (segundos)<input type="number" name="min" min="0" max="3600" required></label><label>Espera máxima (segundos)<input type="number" name="max" min="0" max="3600" required></label><label class="wide row"><span>Respetar el tiempo de visualización de vídeos<div class="hint">Regla para una integración futura. No simula grabaciones en directo.</div></span><input class="switch" name="video" type="checkbox"></label></div><div class="row"><p style="font-size:12px">Los ajustes se conservan en este navegador.<br>Se aplicarán a la IA cuando esté conectada.</p><button class="primary">Guardar configuración</button></div></form>`;const form=$('#settings');for(const [k,v]of Object.entries(config)){const el=form.elements.namedItem(k);if(el)el.type==='checkbox'?el.checked=v:el.value=v}form.onsubmit=e=>{e.preventDefault();const data=new FormData(form),min=Number(data.get('min')),max=Number(data.get('max'));if(max<min){toast('La espera máxima debe ser igual o mayor que la mínima.');return}config={mode:data.get('mode'),tone:data.get('tone'),instructions:data.get('instructions'),words:data.get('words'),avoid:data.get('avoid'),min,max,video:data.has('video')};if(persist())toast('Configuración guardada')}}$('#inboxNav').onclick=()=>{view='inbox';render()};$('#settingsNav').onclick=()=>{view='settings';render()};render();
</script></html>
